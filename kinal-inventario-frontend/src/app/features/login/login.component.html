<div class="flex min-h-[80vh] items-center justify-center">
  <div class="glass-card rounded-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <span class="material-symbols-outlined text-[#00dbe9] text-5xl mb-4">inventory_2</span>
      <h2 class="text-2xl font-bold text-[#dbfcff]">Bodega Pro</h2>
      <p class="text-[#b9cacb] text-sm mt-1">Inicia sesión para gestionar tu almacén</p>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="space-y-5">
      <div class="form-field">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" placeholder="admin@kinal.edu.gt" />
        <small class="error" *ngIf="correo.invalid && correo.touched">Ingresa un correo válido</small>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <small class="error" *ngIf="password.invalid && password.touched">La contraseña es obligatoria</small>
      </div>

      <small class="error" *ngIf="errorMensaje">{{ errorMensaje }}</small>

      <button type="submit" class="btn-primary w-full justify-center" [disabled]="cargando">
        {{ cargando ? "Ingresando..." : "Ingresar" }}
      </button>
    </form>

    <p class="text-center text-xs text-[#b9cacb] mt-6 opacity-60">
      Usuario: <strong class="text-[#dae2fd]">admin&#64;kinal.edu.gt</strong>
    </p>
  </div>
</div>
